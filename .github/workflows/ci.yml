name: CI — Tests & Lint

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  lint-and-audit:
    name: Lint, Types & Security (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@887a942a15af3a7626099df99e897a18d9e5ab3a # v5.2.2
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Checkout Karcytics-SDK
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: KalaimaranB/Karcytics-SDK
          path: Karcytics-SDK
          persist-credentials: false

      - name: Install dependencies
        run: |
          python3 -c "import sys; c=open('pyproject.toml').read(); open('pyproject.toml','w').write(c.replace('\"../Karcytics-SDK\"', '\"./Karcytics-SDK\"'))"
          uv sync --all-extras
        shell: bash

      - name: Ruff — Lint
        run: uv run ruff check src/ tests/
        shell: bash

      - name: Ruff — Format check
        run: uv run ruff format --check src/ tests/
        shell: bash

      - name: Mypy — Type check (analysis strict, UI suppressed)
        run: uv run mypy --explicit-package-bases src/
        shell: bash

      - name: pip-audit — Security vulnerability scan
        run: |
          uv export --format requirements-txt --no-emit-project | grep -v "^-e " | grep -v "Karcytics-SDK" > reqs.txt
          uv run --with pip-audit pip-audit -r reqs.txt --no-deps --disable-pip
        shell: bash

  test:
    name: Tests (${{ matrix.os }})
    needs: lint-and-audit
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@887a942a15af3a7626099df99e897a18d9e5ab3a # v5.2.2
        with:
          python-version: "3.11"
          enable-cache: true

      # Windows Defender's real-time scanner inspects every .pyd/.dll
      # individually as it's touched — numpy/scipy/pandas/PyQt6 collectively
      # touch hundreds of them on import, a well-documented 2-3x slowdown
      # multiplier for Python scientific-stack CI on windows-latest.
      - name: Exclude workspace from Windows Defender
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}"
          Add-MpPreference -ExclusionPath "${{ runner.temp }}"

      - name: Checkout Karcytics-SDK
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: KalaimaranB/Karcytics-SDK
          path: Karcytics-SDK
          persist-credentials: false

      - name: Install dependencies
        run: |
          python -c "import sys; c=open('pyproject.toml').read(); open('pyproject.toml','w').write(c.replace('\"../Karcytics-SDK\"', '\"./Karcytics-SDK\"'))"
          uv sync --all-extras
        shell: bash

      # matplotlib builds its font cache from scratch on a first import if
      # MPLCONFIGDIR has nothing in it yet — every GH-hosted runner is a
      # fresh VM, so pin it to a fixed path and let actions/cache persist it.
      - name: Cache matplotlib font cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/mplconfig
          key: mpl-fontcache-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Run tests
        run: uv run pytest tests/ -x -v --tb=short --cov=src --cov-report=term-missing
        env:
          QT_QPA_PLATFORM: offscreen
          MPLCONFIGDIR: ${{ runner.temp }}/mplconfig
        shell: bash
