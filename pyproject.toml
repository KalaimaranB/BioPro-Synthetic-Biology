[project]
name = "synthetic-biology-module"
version = "0.2.0"
description = "Biological logic gate construction, orthogonality checking, and kinetic simulation for synthetic genetic circuits."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "Kalaimaran Balasothy" },
]
dependencies = [
    "karcytics-sdk>=3.0.0",
    "PySide6>=6.6",
    "PySide6-Essentials>=6.6",
    "numpy>=1.26",
    "scipy>=1.11",
    "networkx>=3.1",
    "sbol3>=1.1",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "biopython>=1.80",
    "pyqtgraph>=0.13",
    "requests>=2.28",
    "tellurium>=2.2",
    "urllib3>=2.8.0",
    "tornado>=6.6",
    "certifi>=2026.10.19",
    "pillow>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10.0",
    "pytest-qt>=4.3,<5.0",
    "pytest-cov>=4.1,<5.0",
    "pytest-timeout>=2.3,<3.0",
    "ruff>=0.4,<1.0",
    "mypy>=1.9,<2.0",
    "pip-audit>=2.7,<3.0",
    "pre-commit>=3.6,<4.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.entry-points."karcytics.plugins"]
synthetic_biology = "karcytics_plugins.synthetic_biology:initialize"

[tool.karcytics.plugin]
id = "synthetic_biology"
display_name = "Synthetic Biology"
name = "Synthetic Biology Module"
min_core_version = "2.0.0"
entry_point = "karcytics_plugins.synthetic_biology:initialize"
process_model = "isolated"
environment = ".venv"
requirements = "requirements.txt"
is_beta = true
release_notes = """
First release carrying the primer and amplification workflow, and the first in \
which every Critical and High finding of the internal audit is closed.

New
- Primer design: rubric screening, nearest-neighbour thermodynamics, candidate \
ranking, and export.
- In-silico PCR: binding-site search on linear and circular templates, with no \
product, multiple products and primer-dimer returned as results rather than errors.
- Restriction digest over Bio.Restriction, and a gel migration model.
- Methods text now cites REBASE and the gel mobility model.

Corrected
- Circuit simulation plotted promoter output integrated over time while \
labelling the axis RPU. Production is now scaled by the degradation rate, the \
unit travels with the result, and the demo preset was retuned with margin over \
the re-measured Hopf threshold.
- The CRISPR off-target panel implied a genome-wide search it had not performed; \
it now states the scope it actually covered.
- Flow-cytometry, NGS and parameter-fitting panels presented demonstration and \
unvalidated data as real results. A single integrity rule now gates every view.
- A non-DNA character in a 5' primer tail terminated the application.
- A GenBank feature crossing the origin imported with the length of the whole \
plasmid; compound locations now keep their segments and true extent.
- A PCR product whose origin crossing fell inside the reverse primer's \
footprint was reported as not wrapping.
- The amplify selector read a state key that does not exist, so it never \
offered more than one feature.

Known limitations
- Off-target search covers loaded sequences only; no genome FASTA loading yet.
- Codon-usage and promoter-motif findings of the audit remain open at Medium.
"""
custom_exclusions = ["tests"]
requires = ["task_scheduler", "logger", "event_bus"]
tags = ["synthetic biology", "logic gates", "genetic circuits", "CRISPR", "kinetic simulation", "SBOL", "bioinformatics"]
homepage = "https://github.com/KalaimaranB/Karcytics-SyntheticBiology"
description = """
A scientist-centric environment for designing, validating, and simulating biological logic gates and \
synthetic genetic circuits. Includes orthogonality checking, CRISPR gRNA design, kinetic simulation, \
SBOL part catalogue, and plasmid assembly workflows.\
"""
authors = [
    { name = "Kalaimaran Balasothy", role = "Lead Developer", permissions = ["sign_code"], github = "KalaimaranB", details = "Biomedical Engineering student (Bioinformatics & Cellular Engineering) at UBC. Lead architect of Karcytics." },
]

[tool.karcytics.plugin.signing]
author_public_key = "ed9ceefd12e7eebe2774cb6779bbbcf0a799b994f2c0159643c940e5ae1d580f"


# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
markers = ["unit", "integration", "functional", "ui", "slow", "edge_case"]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
timeout = 120
timeout_method = "thread"


# ── Mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
explicit_package_bases = true
namespace_packages = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "PySide6.*",
    "numpy.*",
    "scipy.*",
    "pandas.*",
    "matplotlib.*",
    "networkx.*",
    "sbol3.*",
    "tellurium.*",
    "pyqtgraph.*",
    "Bio.*",
    "mesa.*",
    "karcytics_sdk.*",
    "karcytics.*",
    "requests.*",
]
ignore_missing_imports = true


# ── uv ────────────────────────────────────────────────────────────────────────
[tool.uv.sources]
karcytics-sdk = { path = "../Karcytics-SDK", editable = true }

[dependency-groups]
dev = [
    "pre-commit>=3.8.0",
    "ruff>=0.16.10",
    "types-requests>=2.33.0.20261006",
]
