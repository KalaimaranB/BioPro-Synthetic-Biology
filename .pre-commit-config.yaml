repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude: ^(security\.json|trust_chain\.json|signature\.bin)$
      - id: check-yaml
        args: [--unsafe]
      - id: check-toml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
      - id: ruff
        name: ruff-check
        args: [--fix]
      - id: ruff-format
        name: ruff-format
